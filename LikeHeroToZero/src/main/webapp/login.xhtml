<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
<h:head>
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f7f5;
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 420px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #047857;
            margin-top: 0;
            font-size: 22px;
            border-bottom: 3px solid #047857;
            padding-bottom: 10px;
        }
        .form-row {
            margin-bottom: 18px;
        }
        .form-row label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 6px;
        }
        .form-row input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-primary {
            background-color: #047857;
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .btn-primary:hover {
            background-color: #059669;
        }
        .error-message {
            margin-top: 15px;
            padding: 10px 15px;
            background-color: #fee2e2;
            border-left: 4px solid #b71c1c;
            color: #b71c1c;
            border-radius: 4px;
        }
    </style>
</h:head>
<h:body>
    <div class="container">
        <h1>Login f&#252;r Wissenschaftler:innen</h1>
        <h:form>
            <div class="form-row">
                <h:outputLabel for="email" value="E-Mail:"/>
                <h:inputText id="email" value="#{loginBean.email}"/>
            </div>
            <div class="form-row">
                <h:outputLabel for="passwort" value="Passwort:"/>
                <h:inputSecret id="passwort" value="#{loginBean.passwort}"/>
            </div>
            <h:commandButton value="Einloggen" action="#{loginBean.login}" styleClass="btn-primary"/>
            <h:panelGroup rendered="#{loginBean.fehlermeldung != null}">
                <div class="error-message">
                    <h:outputText value="#{loginBean.fehlermeldung}"/>
                </div>
            </h:panelGroup>
        </h:form>
    </div>
</h:body>
</html>
